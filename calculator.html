<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<style>
  :root {
    --bg: #f0f2f5;
    --panel: #ffffff;
    --display: #1f2430;
    --display-text: #ffffff;
    --key: #eef0f4;
    --key-text: #1f2430;
    --op: #ffb74d;
    --op-text: #1f2430;
    --accent: #4f7cff;
    --danger: #ff6b6b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141a;
      --panel: #1b1e27;
      --display: #0e1015;
      --key: #2a2e3a;
      --key-text: #f1f3f8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }
  .calc {
    width: 100%;
    max-width: 340px;
    background: var(--panel);
    border-radius: 24px;
    padding: 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,.15);
  }
  .display {
    background: var(--display);
    color: var(--display-text);
    border-radius: 16px;
    padding: 14px 18px;
    margin-bottom: 16px;
    text-align: right;
    min-height: 96px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
  }
  .history {
    font-size: 14px;
    opacity: .6;
    min-height: 18px;
    word-break: break-all;
  }
  .current {
    font-size: 40px;
    font-weight: 600;
    word-break: break-all;
    line-height: 1.15;
  }
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    border: none;
    border-radius: 14px;
    height: 58px;
    font-size: 20px;
    font-weight: 500;
    cursor: pointer;
    background: var(--key);
    color: var(--key-text);
    transition: transform .06s, filter .15s;
  }
  button:hover { filter: brightness(.95); }
  button:active { transform: scale(.94); }
  button.op { background: var(--op); color: var(--op-text); }
  button.eq { background: var(--accent); color: #fff; }
  button.clear { background: var(--danger); color: #fff; }
  button.wide { grid-column: span 2; }
</style>
</head>
<body>
  <div class="calc" role="application" aria-label="Calculator">
    <div class="display">
      <div class="history" id="history"></div>
      <div class="current" id="current">0</div>
    </div>
    <div class="keys">
      <button class="clear" data-action="clear">AC</button>
      <button data-action="back">⌫</button>
      <button data-action="percent">%</button>
      <button class="op" data-op="/">÷</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button class="op" data-op="*">×</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button class="op" data-op="-">−</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button class="op" data-op="+">+</button>

      <button data-action="sign">±</button>
      <button data-num="0">0</button>
      <button data-action="dot">.</button>
      <button class="eq" data-action="equals">=</button>
    </div>
  </div>

<script>
(function () {
  const currentEl = document.getElementById('current');
  const historyEl = document.getElementById('history');
  const symbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };

  let current = '0';
  let previous = null;
  let operator = null;
  let overwrite = false;

  function fmt(str) {
    if (str === 'Error') return str;
    const [int, dec] = str.split('.');
    const neg = int.startsWith('-');
    const digits = neg ? int.slice(1) : int;
    const grouped = digits.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + grouped + (dec !== undefined ? '.' + dec : '');
  }

  function render() {
    currentEl.textContent = fmt(current);
    const len = currentEl.textContent.length;
    currentEl.style.fontSize = len > 14 ? '22px' : len > 10 ? '30px' : '40px';
    historyEl.textContent = operator ? fmt(previous) + ' ' + symbols[operator] : '';
  }

  function compute(a, b, op) {
    a = parseFloat(a); b = parseFloat(b);
    let r;
    switch (op) {
      case '+': r = a + b; break;
      case '-': r = a - b; break;
      case '*': r = a * b; break;
      case '/': if (b === 0) return 'Error'; r = a / b; break;
    }
    return String(parseFloat(r.toPrecision(12)));
  }

  function inputNum(n) {
    if (current === 'Error') current = '0';
    if (overwrite || current === '0') { current = n; overwrite = false; }
    else if (current.replace(/[-.]/g, '').length < 15) current += n;
    render();
  }

  function inputDot() {
    if (current === 'Error' || overwrite) { current = '0'; overwrite = false; }
    if (!current.includes('.')) current += '.';
    render();
  }

  function chooseOp(op) {
    if (current === 'Error') return;
    if (operator && !overwrite) {
      current = compute(previous, current, operator);
      if (current === 'Error') { operator = null; previous = null; render(); return; }
    }
    previous = current;
    operator = op;
    overwrite = true;
    render();
  }

  function equals() {
    if (!operator || current === 'Error') return;
    const result = compute(previous, current, operator);
    historyEl.textContent = fmt(previous) + ' ' + symbols[operator] + ' ' + fmt(current) + ' =';
    current = result;
    operator = null;
    previous = null;
    overwrite = true;
    currentEl.textContent = fmt(current);
  }

  function clearAll() {
    current = '0'; previous = null; operator = null; overwrite = false;
    render();
  }

  function back() {
    if (overwrite || current === 'Error') return;
    current = current.length > 1 && !(current.length === 2 && current[0] === '-') ? current.slice(0, -1) : '0';
    render();
  }

  function percent() {
    if (current === 'Error') return;
    current = String(parseFloat((parseFloat(current) / 100).toPrecision(12)));
    render();
  }

  function sign() {
    if (current === 'Error' || current === '0') return;
    current = current.startsWith('-') ? current.slice(1) : '-' + current;
    render();
  }

  document.querySelector('.keys').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.num !== undefined) inputNum(b.dataset.num);
    else if (b.dataset.op) chooseOp(b.dataset.op);
    else switch (b.dataset.action) {
      case 'clear': clearAll(); break;
      case 'back': back(); break;
      case 'percent': percent(); break;
      case 'sign': sign(); break;
      case 'dot': inputDot(); break;
      case 'equals': equals(); break;
    }
  });

  document.addEventListener('keydown', e => {
    if (/^[0-9]$/.test(e.key)) inputNum(e.key);
    else if (e.key === '.') inputDot();
    else if ('+-*/'.includes(e.key)) { e.preventDefault(); chooseOp(e.key); }
    else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); equals(); }
    else if (e.key === 'Backspace') back();
    else if (e.key === 'Escape' || e.key.toLowerCase() === 'c') clearAll();
    else if (e.key === '%') percent();
  });

  render();
})();
</script>
</body>
</html>
